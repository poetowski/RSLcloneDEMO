<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>Sprite Gallery - The Loom: Reliquary of Legends</title>
  </head>
  <body class="gallery">
    <header>
      <h1>Sprite Gallery</h1>
      <p>Every generated animation, effect and icon, looping at game speed. Hit frames flash a gold border.</p>
      <div class="controls">
        <label><input type="checkbox" id="flip" /> Face left</label>
        <label>Zoom <select id="zoom"><option selected>2</option><option>3</option><option>4</option></select></label>
        <label>Speed <select id="speed"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option></select></label>
        <a href="./index.html">&larr; back to the game</a>
      </div>
    </header>
    <main id="root"></main>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
